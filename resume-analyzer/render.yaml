services:
  - type: web
    name: resume-analyzer-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: FIREBASE_PROJECT_ID
        value: ai-resume-400b1
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

  - type: web
    name: resume-analyzer-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://resume-analyzer-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
